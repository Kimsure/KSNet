name: test_ECBVSR02_Vimeo_BD
model_type: VideoRecurrentModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:  # the 1st test dataset
    name: Vimeo90K
    type: VideoTestVimeo90KDataset
    dataroot_gt: ../../data/vimeo_septuplet/sequences
    dataroot_lq: ../../data/vimeo_septuplet_matlabBDLRx4/sequences
    meta_info_file: basicsr/data/meta_info/meta_info_Vimeo90K_test_GT.txt
    cache_data: false
    io_backend:
      type: disk
    num_frame: 7

# network structures
network_g:
  type: ECBVSR
  mid_channels: 64
  num_blocks: 7
  is_low_res_input: true
  spynet_path: experiments/pretrained_models/flowNet/spynet_sintel_final-3d2a1287.pth

# path
path:
  pretrain_network_g: experiments/train_ECBVSR_Vimeo_BD_pretrain_4x2/models/net_g_280000.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  flip_seq: true
  double_flip_seq: true
  center_frame_only: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true
